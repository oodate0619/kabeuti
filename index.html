<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Executive Brain Mirror - Voice Enabled</title>
    <style>
        /* --- 既存のスタイル --- */
        :root {
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-sub: #7F8C8D;
            --accent-color: #2980B9;
            --accent-hover: #3498DB;
            --record-color: #E74C3C; /* 録音中の赤 */
            --border-color: #E0E0E0;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            height: 100vh; /* 全画面固定 */
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            flex-shrink: 0;
        }

        h1 { font-size: 1.1rem; margin: 0; color: var(--text-main); }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background-color: #f9f9f9;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .mode-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background-color: #fff;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-sub);
        }

        .mode-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        #chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fff;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.ai {
            align-self: flex-start;
            background-color: #F2F4F8;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background-color: #fff;
            display: flex;
            align-items: center; /* 垂直中央揃え */
            gap: 10px;
            flex-shrink: 0;
            padding-bottom: max(15px, env(safe-area-inset-bottom)); /* iPhone下部対応 */
        }

        /* --- マイクボタンのスタイル --- */
        #mic-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: #fff;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        #mic-btn.recording {
            background-color: var(--record-color);
            color: #fff;
            border-color: var(--record-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            resize: none;
            height: 24px; /* 1行分の高さ */
            font-family: inherit;
            font-size: 16px; /* iOSでのズーム防止 */
            outline: none;
            line-height: 24px;
            max-height: 100px;
        }

        #send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* SVG Icons */
        .icon { width: 20px; height: 20px; fill: currentColor; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Brain Mirror +Voice</h1>
    </header>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('coach')">壁打ち</button>
        <button class="mode-btn" onclick="setMode('hiring')">求人票</button>
        <button class="mode-btn" onclick="setMode('swot')">SWOT</button>
    </div>

    <div id="chat-area">
        <div class="message ai" id="intro-msg">
            マイクボタンを押して、今の悩みを話しかけてください。<br>
            散歩中や運転中でも思考を整理します。
        </div>
    </div>

    <div class="input-area">
        <button id="mic-btn" onclick="toggleRecording()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 2.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        
        <textarea id="user-input" placeholder="メッセージを入力..."></textarea>
        
        <button id="send-btn" onclick="sendMessage()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
    // --- 音声認識ロジック (Web Speech API) ---
    const micBtn = document.getElementById('mic-btn');
    const inputField = document.getElementById('user-input');
    let recognition = null;
    let isRecording = false;

    // ブラウザ互換性チェック
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true; // 途中経過を表示
        recognition.continuous = false;    // 一文ごとに区切るかどうか

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            inputField.placeholder = "聞いています...";
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
            inputField.placeholder = "メッセージを入力...";
        };

        recognition.onresult = (event) => {
            const transcript = Array.from(event.results)
                .map(result => result[0].transcript)
                .join('');
            inputField.value = transcript;
            // 高さ自動調整
            inputField.style.height = 'auto';
            inputField.style.height = inputField.scrollHeight + 'px';
        };

        recognition.onerror = (event) => {
            console.error(event.error);
            isRecording = false;
            micBtn.classList.remove('recording');
            alert('音声認識エラー: ' + event.error);
        };
    } else {
        micBtn.style.display = 'none'; // 非対応ブラウザでは隠す
        console.log("Web Speech API not supported");
    }

    function toggleRecording() {
        if (!recognition) return;
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
    }

    // --- チャットロジック (Mock) ---
    let currentMode = 'coach';
    
    // 省略：PROMPTSオブジェクトは前のコードと同じ

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('chat-area').innerHTML = '';
        // モード変更時の初期メッセージを再表示する場合はここで処理
    }

    function addMessage(sender, text) {
        const chatArea = document.getElementById('chat-area');
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        addMessage('user', text);
        inputField.value = '';
        inputField.style.height = '24px'; // 高さリセット

        // Mock AI Response
        setTimeout(() => {
            let responseText = "なるほど、それについてもう少し詳しく教えてください。";
            if(currentMode === 'hiring') responseText = `「${text}」という点は、求職者にとって実は魅力になる可能性がありますね。`;
            if(currentMode === 'swot') responseText = "それは「強み」に分類できそうです。";
            
            addMessage('ai', responseText);
        }, 1000);
    }
</script>
</body>
</html>
