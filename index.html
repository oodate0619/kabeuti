<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Executive Brain Mirror - Demo Ready</title>
    <style>
        /* --- Base Styles --- */
        :root {
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-sub: #7F8C8D;
            --accent-color: #2980B9;
            --accent-light: #EAF2F8;
            --border-color: #E0E0E0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            background: #fff;
        }
        
        h1 { font-size: 1.1rem; margin: 0; }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-bottom: 1px solid #eee;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mode-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 2px 5px rgba(41, 128, 185, 0.2);
        }

        #chat-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .ai { background: #F2F4F8; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: var(--accent-color); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }

        /* --- 提案チップエリア (新規追加) --- */
        #suggestion-area {
            padding: 10px 15px 0 15px;
            background: #fff;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Firefox */
        }
        #suggestion-area::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .chip {
            display: inline-block;
            padding: 6px 12px;
            background-color: var(--accent-light);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        
        .chip:active { background-color: #D4E6F1; }

        /* 入力エリア */
        .input-area {
            padding: 10px 15px 15px 15px; /* 上パディングを減らす */
            border-top: none; /* チップエリアとの境界を消す */
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .voice-guide {
            font-size: 0.75rem;
            color: #E67E22;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding-bottom: 5px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: none;
            height: 24px;
            font-size: 16px;
            line-height: 24px;
            max-height: 100px;
            font-family: inherit;
        }
        
        textarea:focus { border-color: var(--accent-color); outline: none; }

        #send-btn {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Executive Brain Mirror</h1>
    </header>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('coach')">壁打ち</button>
        <button class="mode-btn" onclick="setMode('hiring')">求人票</button>
        <button class="mode-btn" onclick="setMode('swot')">SWOT</button>
    </div>

    <div id="chat-area">
        </div>

    <div id="suggestion-area">
        </div>

    <div class="input-area">
        <div class="voice-guide">
            <span>💡 キーボードの 🎤 で音声入力も可能です</span>
        </div>
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="ここに入力..." rows="1"></textarea>
            <button id="send-btn" onclick="sendMessage()">送信</button>
        </div>
    </div>
</div>

<script>
    // --- データ定義: 各モードの「刺さる」例文 ---
    const SUGGESTIONS = {
        coach: [
            "最近、古株の社員が辞めそうで不安だ",
            "新しい事業アイデアがあるが自信がない",
            "銀行への返済計画について相談したい",
            "とにかく頭がモヤモヤしている"
        ],
        hiring: [
            "給料は高くないが、技術は日本一だ",
            "残業は多いが、独立できる実力がつく",
            "未経験でもいいから、ガッツがある奴が欲しい",
            "右腕になってくれる幹部候補が欲しい"
        ],
        swot: [
            "競合他社が値下げを始めて困っている",
            "円安で仕入れコストが上がっている",
            "地元の老舗としてのブランド力はある",
            "若手の採用がまったくうまくいかない"
        ]
    };

    const INTRO_MESSAGES = {
        coach: "壁打ちモードです。「社員の離職」や「資金繰り」など、誰にも言えない悩みをタップするか、話しかけてください。",
        hiring: "求人票モードです。「自社の厳しさ」や「求める人物像」を本音で選んでください。魅力的な言葉に翻訳します。",
        swot: "SWOTモードです。最近気になっている「競合の動き」や「自社の強み」を選んでみてください。"
    };

    let currentMode = 'coach';
    const inputField = document.getElementById('user-input');
    const chatArea = document.getElementById('chat-area');
    const suggestionArea = document.getElementById('suggestion-area');

    // 初期化
    window.onload = () => setMode('coach');

    // テキストエリアの自動伸縮
    inputField.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    function setMode(mode) {
        currentMode = mode;
        
        // ボタンのアクティブ化
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        // チャットリセット
        chatArea.innerHTML = '';
        addMessage('ai', INTRO_MESSAGES[mode]);

        // 例文チップの更新
        renderSuggestions(mode);
    }

    function renderSuggestions(mode) {
        suggestionArea.innerHTML = ''; // クリア
        SUGGESTIONS[mode].forEach(text => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerText = text;
            chip.onclick = () => useSuggestion(text);
            suggestionArea.appendChild(chip);
        });
    }

    function useSuggestion(text) {
        inputField.value = text;
        inputField.style.height = 'auto'; // 高さ調整
        inputField.style.height = inputField.scrollHeight + 'px';
        // オプション: 自動送信したい場合はここで sendMessage() を呼ぶ
        // sendMessage(); 
    }

    function addMessage(sender, text) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        addMessage('user', text);
        inputField.value = '';
        inputField.style.height = '24px';

        // 模擬AI応答 (デモ用)
        setTimeout(() => {
            let response = "";
            if (currentMode === 'coach') {
                response = `「${text.substring(0,10)}...」という悩みですね。\n\nでは一つ質問させてください。\nもし明日、その問題が完全に解決したとしたら、あなたの会社の何が一番変わりますか？`;
            } else if (currentMode === 'hiring') {
                response = `その「${text}」という本音こそが差別化になります！\n\n【求人キャッチコピー案】\n『${text}。だからこそ、本物のプロになれる環境があります。』\n\nこのように「厳しさ」を「メリット」に変換すると、覚悟のある良い人材だけが集まります。`;
            } else if (currentMode === 'swot') {
                response = `なるほど、「${text}」ですね。\n\nSWOT分析の観点では、それは戦略的な「脅威（Threat）」または「強み（Strength）」になります。\n\nこれに対して、現在打てる手は「価格勝負」と「品質特化」のどちらが現実的でしょうか？`;
            }
            addMessage('ai', response);
        }, 800);
    }
</script>
</body>
</html>
