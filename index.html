<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Brain Mirror - 経営判断・壁打ちパートナー</title>
    <style>
        :root {
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-sub: #7F8C8D;
            --accent-color: #2980B9; /* Calm Blue */
            --accent-hover: #3498DB;
            --border-color: #E0E0E0;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            background-color: #fff;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.05em;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background-color: #f9f9f9;
            border-bottom: 1px solid var(--border-color);
        }

        .mode-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            background-color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            color: var(--text-sub);
        }

        .mode-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 2px 4px rgba(41, 128, 185, 0.3);
        }

        .mode-btn:hover:not(.active) {
            background-color: #f0f0f0;
        }

        #chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fff;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.ai {
            align-self: flex-start;
            background-color: #F2F4F8;
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background-color: #fff;
            display: flex;
            gap: 10px;
            position: sticky;
            bottom: 0;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: none;
            height: 50px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        #send-btn {
            padding: 0 25px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        #send-btn:hover {
            background-color: var(--accent-hover);
        }

        #send-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .system-note {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
            margin-top: 10px;
            padding-bottom: 5px;
        }

        /* Loading indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: #F2F4F8;
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--text-sub);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Executive Brain Mirror</h1>
        <div style="font-size: 0.8rem; color: #7F8C8D; margin-top: 5px;">経営者の孤独な思考を整理・拡張する</div>
    </header>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('coach')">壁打ち (Coach)</button>
        <button class="mode-btn" onclick="setMode('hiring')">求人票作成</button>
        <button class="mode-btn" onclick="setMode('swot')">SWOT戦略</button>
    </div>

    <div id="chat-area">
        <div class="message ai">
            こんにちは。私はあなたの思考を整理するパートナーです。<br>
            今日はどのような悩みやアイデアについて壁打ちしますか？<br>
            <br>
            例：「新規事業のアイデアがあるがまとまらない」「最近、社員の離職が続いていて不安だ」
        </div>
    </div>

    <div class="typing-indicator" id="loader">
        考え中 <span></span><span></span><span></span>
    </div>

    <div class="input-area">
        <textarea id="user-input" placeholder="ここに入力してください..."></textarea>
        <button id="send-btn" onclick="sendMessage()">送信</button>
    </div>
    <div class="system-note">※ 入力された内容はブラウザ内で処理され、外部サーバーには保存されません。</div>
</div>

<script>
    // Configuration for Mock Response (In production, replace with API call)
    let currentMode = 'coach';
    
    const PROMPTS = {
        coach: {
            role: "あなたは優秀なエグゼクティブ・コーチです。ユーザー（経営者）の抽象的な発言に対し、答えを教えるのではなく、「問い」を投げかけて思考を深掘りさせてください。一度に複数の質問をせず、一つずつ核心に迫ってください。",
            intro: "こんにちは。私はあなたの思考を整理するパートナーです。今日はどのような悩みやアイデアについて壁打ちしますか？"
        },
        hiring: {
            role: "あなたは採用コンサルタントです。経営者の「想い」や「厳しさ」を、求職者にとっての「メリット（成長環境、やりがい）」に翻訳して魅力的な求人票の骨子を作成してください。",
            intro: "求人票作成モードです。まずは「どんな人物が欲しいか」や「自社の厳しさ・現実」を遠慮なく書き出してください。私がそれを魅力的なメッセージに変換します。"
        },
        swot: {
            role: "あなたは戦略コンサルタントです。ユーザーの入力から強み・弱み・機会・脅威を整理し、クロスSWOT分析を行って具体的な戦略オプションを提示してください。",
            intro: "SWOT分析モードです。現状の「自社の強み・弱み」や「市場の機会・脅威」について、思いつくままに入力してください。"
        }
    };

    function setMode(mode) {
        currentMode = mode;
        
        // Update UI
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        // Reset Chat
        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML = '';
        addMessage('ai', PROMPTS[mode].intro);
    }

    function addMessage(sender, text) {
        const chatArea = document.getElementById('chat-area');
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const text = inputField.value.trim();
        if (!text) return;

        // User Message
        addMessage('user', text);
        inputField.value = '';
        
        // Show Loader
        const loader = document.getElementById('loader');
        loader.style.display = 'block';
        document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;

        // Simulate AI Delay & Response (Replace this block with fetch API to LLM)
        setTimeout(() => {
            loader.style.display = 'none';
            const response = generateMockResponse(text, currentMode);
            addMessage('ai', response);
        }, 1500);
    }

    // Mock Response Generator (Prototype Logic)
    function generateMockResponse(input, mode) {
        if (mode === 'coach') {
            return `「${input.substring(0, 10)}...」という点について、もう少し詳しく教えていただけますか？\n特に、それが実現したとき、一番喜ぶのは誰だとお考えでしょうか？`;
        } else if (mode === 'hiring') {
            return `なるほど、「${input}」という条件ですね。\n\n【求職者への訴求案】\n「${input}」という厳しさは、裏を返せば「圧倒的な成長スピード」や「プロフェッショナルとしての誇り」と捉えることができます。\n\n例えば、キャッチコピーとして：\n『未経験お断り。本気で〇〇を極めたい人以外は応募しないでください』\nという打ち出しはいかがでしょう？`;
        } else if (mode === 'swot') {
            return `入力ありがとうございます。\n\n【簡易分析】\n今の内容から考えると、\n強み（Strengths）: 独自のノウハウ\n機会（Opportunities）: 市場の拡大傾向\n\nここから導き出される「積極攻勢戦略（SO戦略）」として、\n「既存のノウハウをデジタル化して、拡大する市場へパッケージ販売する」\nという方向性が考えられますが、いかがでしょうか？`;
        }
    }

    // Enable Enter key to send
    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

</script>

</body>
</html>
